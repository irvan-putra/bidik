# Host-side unit tests (Robolectric included): fast verification for
# changes that do not need an emulator. Manual trigger only.
# No secrets, no signing, contents: read. Test reports stay on the
# repo's own run page.
name: unit-check
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-check
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (its buildPython);
      # ubuntu-latest ships 3.12+, so the build host needs 3.10 explicitly.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
