# DeltaChat runtime smoke - proves the vendored arm64 rpc core loads and
# answers on an Android runtime, with NO account, NO network and NO keys.
# On the x86_64 google_apis emulator this exercises the image's ARM
# translation (compatibility is an open question this job answers by
# observation; the Denyut app reportedly ran an arm64-only runtime on the
# same accelerated API34 x86 image family). Manual trigger only. No
# secrets. Separate from capture-check so the green capture job is never
# disturbed by this experiment.
name: dc-runtime-smoke
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (its buildPython);
      # ubuntu-latest ships 3.12+, so the build host needs 3.10 explicitly.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Enable KVM (hardware acceleration) or stop
        # No silent TCG runs (capture-check learned this the hard way:
        # 7 runs of starvation symptoms). Same gate as capture-check.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo 'KVM unavailable to this job; refusing a silent TCG run' >&2; exit 1; }
      - name: Build app + test APKs (arm64, vendored rpc server)
        # No -PciEmulator: fetchRpcServer downloads the pinned official
        # wheel and double-hash-verifies the arm64 binary (THIRD-PARTY.md).
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Runtime smoke on ARM-translating emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          # google_apis API34 x86_64 images ship ARM->x86 translation;
          # the default AOSP image does not advertise arm64 support.
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            echo "== ABI evidence (is arm64 advertised on this x86_64 image?) =="
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            echo "== install (arm64-only APKs) =="
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "== runtime smoke =="
            set +e
            timeout -k 30 600 adb shell "am instrument -w -e class com.vanipy.bidik.DcRuntimeSmokeTest com.vanipy.bidik.test/androidx.test.runner.AndroidJUnitRunner" > /tmp/smoke.log 2>&1
            irc=$?
            set -e
            sed -E 's#https?://[^ ]*#[url]#g' /tmp/smoke.log
            if [ $irc -ne 0 ] || ! grep -q '^OK (' /tmp/smoke.log; then
              echo "runtime smoke failed; last logcat:" >&2
              adb logcat -d -t 300 >&2 || true
              exit 1
            fi
