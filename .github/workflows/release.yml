# Public release build - REVIEW DRAFT, not yet active.
# Adapted from intodo's release.yml. Signs with the project keystore held
# ONLY in GitHub Actions secrets (write-only; the keystore is created once
# and stored by the repo's authorized release custodian; never in repo,
# logs, artifacts, or messages):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Manual trigger only. Tag and stamped binary version always match inputs.
# The release version is also stamped visibly on the launcher icon; APK asset is
# named app-v<version>.apk, a direct release asset (no ZIP).
name: release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName, dotted numeric, e.g. 0.1.0'
        required: true
      version_code:
        description: 'versionCode, positive integer, must exceed the current one'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Validate and stamp version (inputs via env, never interpolated into the shell)
        env:
          IN_NAME: ${{ inputs.version_name }}
          IN_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$IN_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad versionName: $IN_NAME"; exit 1; }
          [[ "$IN_CODE" =~ ^[0-9]+$ ]] && [ "$IN_CODE" -gt 0 ] || { echo "bad versionCode: $IN_CODE"; exit 1; }
          cur_code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          [ "$IN_CODE" -gt "$cur_code" ] || { echo "versionCode $IN_CODE not above current $cur_code"; exit 1; }
          sed -i "s/versionName '.*'/versionName '$IN_NAME'/" app/build.gradle
          sed -i "s/versionCode .*/versionCode $IN_CODE/" app/build.gradle
          # Badge the version onto the launcher icon, readable in the
          # safe area.
          pip install pillow
          python3 tools/badge_icon.py "$IN_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/res/mipmap-*/ic_launcher.png
          git commit -m "release: stamp v$IN_NAME ($IN_CODE)"
          git push origin HEAD:main
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign, tag and publish release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # Keystore exists only in this job's temp dir, never in repo/logs.
          echo "$KEYSTORE_BASE64" | base64 -d > "$work/ks.jks"
          unsigned=$(ls app/build/outputs/apk/release/app-release-unsigned.apk)
          aligned="$work/aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$work/ks.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out "bidik-v$IN_NAME.apk" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "bidik-v$IN_NAME.apk" | head -3
          rm -rf "$work"
          git tag "v$IN_NAME"
          git push origin "v$IN_NAME"
          gh release create "v$IN_NAME" "bidik-v$IN_NAME.apk" --title "bidik v$IN_NAME" --notes "bidik v$IN_NAME"
          # direct asset link, no ZIP: version in the filename, early enough not to truncate
          gh release view "v$IN_NAME" --json assets --jq '.assets[].url'
