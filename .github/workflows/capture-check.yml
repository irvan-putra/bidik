# Capture pixel check - runs the instrumented capture pipeline on an
# emulator and uploads the captured PNGs as run artifacts so renders can be
# pixel-inspected WITHOUT a local Android toolchain. Manual trigger only.
# No secrets, no signing, contents: read. Artifacts stay on the repo's own
# run page.
name: capture-check
on:
  workflow_dispatch:
    inputs:
      queue_url:
        description: 'public page URL to capture (default: the vana canvas currently under review)'
        required: false
        default: 'https://vanipy.com/vana/'

permissions:
  contents: read

concurrency:
  group: capture-check
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (its buildPython);
      # ubuntu-latest ships 3.12+, so the build host needs 3.10 explicitly.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Unit tests + UI render (protocol, URL guard, phone-width render)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Collect UI render
        run: |
          set -euo pipefail
          mkdir -p renders
          cp /tmp/bidik-main-activity.png renders/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-render
          path: renders/
          retention-days: 14
          if-no-files-found: error
      - name: Host capacity check (fits the AVD resource request?)
        run: |
          echo "nproc=$(nproc)"
          grep MemTotal /proc/meminfo
      - name: Instrumented capture pipeline on emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        env:
          # Passed via env, never interpolated into the script text.
          QUEUE_URL: ${{ inputs.queue_url }}
        with:
          api-level: 34
          # Runs 43690400798/43691269603/43693076299: the system server
          # crashed mid-run three times in a row (networkstack death ->
          # zygote fatal) on the default 2-core/2560MB profile under
          # -accel off. Resource starvation is the leading candidate
          # (bounded: no OOM-killer evidence captured). More headroom.
          cores: 4
          ram-size: 4096
          # v2.33.0 supports: default, google_apis, aosp_atd, google_atd,
          # google_apis_playstore, android-wear(-cn), android-tv, google-tv.
          # default = AOSP image, enough for a WebView capture check.
          target: default
          arch: x86_64
          # Keep the action's headless/software-rendering defaults. Pin public
          # resolvers to test whether guest DNS forwarding caused the last run's
          # host-resolution failure; the live target remains unchanged.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          # -PciEmulator selects the x86_64 ABI for the emulator; the
          # DeltaChat runtime is never started in this test.
          # Captures are pulled INSIDE this script while the emulator is
          # still alive; a later step would find the device stopped.
          # The pinned action runs each script line in its own sh process; use one helper invocation.
          script: sh tools/capture-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-pixels
          path: captures/
          retention-days: 14
          if-no-files-found: error
