# Capture pixel check - runs the instrumented capture pipeline on an
# emulator and uploads the captured PNGs as run artifacts so renders can be
# pixel-inspected WITHOUT a local Android toolchain. Manual trigger only.
# No secrets, no signing, contents: read. Artifacts stay on the repo's own
# run page.
name: capture-check
on:
  workflow_dispatch:
    inputs:
      queue_url:
        description: 'public page URL to capture (default: the vana canvas currently under review)'
        required: false
        default: 'https://vanipy.com/vana/'

permissions:
  contents: read

concurrency:
  group: capture-check
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (its buildPython);
      # ubuntu-latest ships 3.12+, so the build host needs 3.10 explicitly.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Unit tests + UI render (protocol, URL guard, phone-width render)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Collect UI render
        run: |
          set -euo pipefail
          mkdir -p renders
          cp /tmp/mata-main-activity.png renders/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-render
          path: renders/
          retention-days: 14
          if-no-files-found: error
      - name: Instrumented capture pipeline on emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        env:
          # Passed via env, never interpolated into the script text.
          QUEUE_URL: ${{ inputs.queue_url }}
        with:
          api-level: 34
          target: aosp
          arch: x86_64
          # ciAllAbis drops the arm64-only filter for the emulator; the
          # DeltaChat runtime is never started in this test.
          # Captures are pulled INSIDE this script while the emulator is
          # still alive; a later step would find the device stopped.
          script: |
            set -euo pipefail
            case "$QUEUE_URL" in
              https://*) ;;
              *) echo "queue_url must be a public https URL, got: $QUEUE_URL"; exit 1 ;;
            esac
            ./gradlew -PciAllAbis connectedDebugAndroidTest --no-daemon \
              -Pandroid.testInstrumentationRunnerArguments.queue_url="$QUEUE_URL"
            mkdir -p captures
            adb pull /sdcard/Android/data/com.vanipy.mata/files/captures captures
            ls -laR captures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-pixels
          path: captures/
          retention-days: 14
          if-no-files-found: error
