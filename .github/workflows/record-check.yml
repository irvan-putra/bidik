# Screen-recorder runtime check: answers the real system consent prompt
# on an emulator, records a few seconds of the actual screen, stops, and
# asserts a playable non-blank MP4. Uploads the video plus a mid frame so
# the result can be pixel-inspected without a device. Manual trigger only.
# No secrets, no signing, contents: read. Artifacts stay on the repo's own
# run page.
name: record-check
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-check
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (its buildPython);
      # ubuntu-latest ships 3.12+, so the build host needs 3.10 explicitly.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Enable KVM (hardware acceleration) or stop
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo 'KVM unavailable to this job; refusing a silent TCG run' >&2; exit 1; }
      - name: Instrumented record run on emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          target: default
          arch: x86_64
          # Audio stays on: the game-sound test plays a tone and asserts
          # it lands in the recording; -noaudio would make every capture
          # silent.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: sh tools/record-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: record-pixels
          path: recordings/
          retention-days: 14
          if-no-files-found: error
