# BRANCH-LOCAL SCAFFOLDING (wip/preview-delete): run host unit tests in
# CI because the local sandbox stalls on the Robolectric android-all
# download. Revert to the emulator record-check before merge.
name: record-check
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-check-wip-preview-delete
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Locate render evidence
        if: always()
        run: find "$GITHUB_WORKSPACE" /home/runner -name 'bidik-trim-*.png' -print 2>/dev/null
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            **/bidik-trim-*.png
          if-no-files-found: error
