plugins { id 'com.android.application'; id 'com.chaquo.python'; id 'org.jetbrains.kotlin.android' }

android {
    testOptions { unitTests { includeAndroidResources = true } }
    buildFeatures { buildConfig true }
    namespace 'com.vanipy.mata' // application namespace
    compileSdk 34
    defaultConfig {
        applicationId 'com.vanipy.mata'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Chaquopy requires an explicit ABI list, so the filter is always
        // set, never dropped. Production builds arm64-v8a only: the
        // DeltaChat rpc server binary is published upstream for
        // arm64-v8a and armeabi-v7a, no x86. The CI emulator capture
        // check builds x86_64 via -PciEmulator; that variant never
        // starts the DeltaChat runtime, so the absent x86 server binary
        // is never exercised there.
        if (project.hasProperty('ciEmulator')) {
            ndk { abiFilters 'x86_64' }
        } else {
            ndk { abiFilters 'arm64-v8a' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

chaquopy {
    defaultConfig {
        pip {
            install 'deltachat-rpc-client==2.69.0'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
