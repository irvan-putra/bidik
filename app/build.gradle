plugins { id 'com.android.application'; id 'com.chaquo.python'; id 'org.jetbrains.kotlin.android' }

android {
    testOptions { unitTests { includeAndroidResources = true } }
    buildFeatures { buildConfig true }
    namespace 'com.vanipy.bidik' // application namespace
    compileSdk 34
    defaultConfig {
        applicationId 'com.vanipy.bidik'
        minSdk 26
        targetSdk 34
        // AndroidJUnitRunner is required for Gradle to discover the JUnit4
        // instrumentation tests in src/androidTest. Without it, Gradle can
        // exit successfully after starting zero tests.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode((project.findProperty('versionCode') ?: '9') as Integer)
        versionName((project.findProperty('versionName') ?: '0.1.8') as String)
        // Chaquopy requires an explicit ABI list, so the filter is always
        // set, never dropped. Production builds arm64-v8a only: the
        // DeltaChat rpc server vendored under jniLibs (see THIRD-PARTY.md)
        // is published upstream for arm64-v8a and armeabi-v7a, no x86.
        // The CI emulator capture check builds x86_64 via -PciEmulator;
        // that variant never starts the DeltaChat runtime, so the absent
        // x86 server binary is never exercised there.
        if (project.hasProperty('ciEmulator')) {
            ndk { abiFilters 'x86_64' }
        } else {
            ndk { abiFilters 'arm64-v8a' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    // Generated by fetchRpcServer (see below); holds the verified
    // arm64-v8a librpcsrv.so outside the committed tree.
    sourceSets { main { jniLibs.srcDir("${buildDir}/rpcsrv/jniLibs") } }
}

chaquopy {
    defaultConfig {
        pip {
            install 'deltachat-rpc-client==2.69.0'
        }
    }
}

// Vendored DeltaChat rpc server, fetched at build time from the pinned
// official wheel and hash-verified twice (wheel, then the extracted
// binary). The binary itself is never committed to git. Provenance,
// hashes and license: THIRD-PARTY.md. The CI emulator variant
// (-PciEmulator) never starts the DeltaChat runtime and skips this.
def rpcWheelFile = "${buildDir}/rpcsrv/deltachat_rpc_server-2.69.0.whl"
def rpcLibOut = "${buildDir}/rpcsrv/jniLibs/arm64-v8a/librpcsrv.so"
tasks.register('fetchRpcServer') {
    onlyIf { !project.hasProperty('ciEmulator') }
    doLast {
        def sha = { File f ->
            java.security.MessageDigest.getInstance('SHA-256')
                .digest(f.bytes).encodeHex().toString()
        }
        def binaryOk = { File f ->
            f.exists() && sha(f) == '101c7c59675f295efa601eba0e4bcf01fa2456e44b8aa9ed2fa999c6fb995257'
        }
        def out = file(rpcLibOut)
        // The cached binary is ALWAYS hash-checked; a match skips the
        // download, anything else is deleted and fetched again.
        if (binaryOk(out)) return
        if (out.exists()) out.delete()
        def wheel = file(rpcWheelFile)
        wheel.parentFile.mkdirs()
        if (!wheel.exists()) {
            new URL('https://files.pythonhosted.org/packages/50/66/7b6428ac9a4a73bfc3199a26477b2fb3d0e60d78485c1d0d0b2b755a04f8/deltachat_rpc_server-2.69.0-py3-none-android_21_arm64_v8a.whl')
                .withInputStream { s -> wheel.newOutputStream() << s }
        }
        // Wheel hash per the PyPI release metadata for 2.69.0.
        if (sha(wheel) != '8951349d8805e276ac574f7588a9a23759c33bc208443eafc48ab03361bf0c54') {
            wheel.delete()
            throw new GradleException('rpc server wheel sha256 mismatch; deleted')
        }
        def zip = new java.util.zip.ZipFile(wheel)
        try {
            def entry = zip.getEntry('deltachat_rpc_server/deltachat-rpc-server')
            if (entry == null) {
                throw new GradleException('rpc server binary missing from the official wheel')
            }
            out.parentFile.mkdirs()
            zip.getInputStream(entry).withStream { s -> out.newOutputStream() << s }
        } finally {
            zip.close()
        }
        out.setExecutable(true)
        // Binary hash recorded in THIRD-PARTY.md.
        if (!binaryOk(out)) {
            out.delete()
            throw new GradleException('rpc server binary sha256 mismatch; deleted')
        }
    }
}
preBuild.dependsOn 'fetchRpcServer'

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
